schema_version: "1.0"

workflow:
  id: "speckit-flow-plan"
  name: "Plan Implementation"
  version: "0.4.1"
  author: "pegagio"
  description: "Run the planning skill and retry missing or placeholder outputs until populated or a bounded stop."

requires:
  speckit_version: ">=1.0.10.dev0+pegagio.2"
  integrations:
    any: ["codex"]

inputs:
  feature_context:
    type: string
    required: true
    prompt: "Identify the reviewed feature specification to plan"
  integration:
    type: string
    default: "codex"
    enum: ["codex"]

steps:
  - id: plan-output-loop
    type: do-while
    condition: "{{ steps.verify-plan-output.output.state == 'continue' }}"
    max_iterations: 5
    steps:
      - id: prepare-plan-request
        type: prompt
        prompt: >-
          Prepare the speckit.plan argument string for {{ inputs.feature_context }}. On the first pass, inspect existing planning outputs and record stable IDs for missing required artifacts or unresolved template sections as the progress baseline. On later passes, use the latest verify-plan-output remaining_ids and their exact file/section details. Return remaining_ids containing those stable file/section gap IDs and args directing the planning skill to create or complete those outputs within the reviewed specification, preserve completed design and existing decisions, ask the operator for substantive product decisions, and report artifact paths, checks, and any blocker. Do not generate tasks or invoke another FlowKit workflow. Do not assess design quality.
      - id: create-plan
        command: "speckit.plan"
        integration: "{{ inputs.integration }}"
        flow_kit:
          delegated: true
          agent: Architect
        input:
          args: "{{ steps.prepare-plan-request.output.args }}"
      - id: verify-plan-output
        type: prompt
        flow_kit:
          delegated: true
          agent: Verifier
        prompt: >-
          Use these pre-pass gap IDs as the progress baseline: {{ steps.prepare-plan-request.output.remaining_ids }}. Verify the planning outputs for {{ inputs.feature_context }} against the core planning skill's required and applicable deliverables. Inspect plan.md, research.md, data-model.md, quickstart.md, and contracts when required by the feature. Check that required files exist and contain substantive content rather than unfilled template placeholders or unresolved NEEDS CLARIFICATION markers. Accept explicit, justified not-applicable sections; do not review technical design quality or invent new deliverables. Return a structured outcome envelope with state complete, continue, needs-human, or blocked; a stable reason_code; repository-relative evidence paths with current SHA-256 digests; remaining_ids identifying each exact missing file or placeholder section; resolved_ids identifying gaps from the prepared baseline or prior verification now filled; and exactly one of next_step_id or resume_action as required. Include an existing specification as evidence when an output file is missing. Use complete only when required outputs are populated and no reported planning gate failure remains. Use continue when specific output gaps remain safely repairable by speckit.plan and set next_step_id to prepare-plan-request. Use needs-human for a required operator decision and blocked for a concrete prerequisite, failed constitutional gate, or unsafe retry, with a stable resume_action. Command success or changed bytes alone is not completion or progress.
  - id: report-plan-outcome
    type: prompt
    prompt: >-
      Report the latest verified planning outcome for {{ inputs.feature_context }} and present the generated design artifacts for operator review. Identify exact missing files or sections, any blocker or operator question, and the safe resumption action when incomplete. No progress or exhaustion of the five-pass safety limit is a bounded stop, not planning completion. Stop this workflow here. Task generation requires a separate operator invocation.
