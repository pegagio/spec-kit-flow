schema_version: "1.0"

workflow:
  id: "speckit-flow-start-feature"
  name: "Start Eligible Feature"
  version: "0.5.0"
  author: "pegagio"
  description: "Prepare one uniquely eligible roadmap feature through an approval-gated roadmap transition, cited context, specification, and roadmap brief."

requires:
  speckit_version: ">=1.0.10.dev0"
  integrations:
    any: ["codex"]

inputs:
  feature_request:
    type: string
    required: true
    prompt: "Describe the eligible roadmap feature to assess"
  integration:
    type: string
    default: "codex"
    enum: ["codex"]
  roadmap_decision:
    type: string
    default: ""
  linkage_patch_decision:
    type: string
    default: ""
  final_review_decision:
    type: string
    default: ""

steps:
  - id: assess-eligibility
    flow_kit:
      delegated: true
      agent: Architect
    type: prompt
    integration: "{{ inputs.integration }}"
    prompt: "Assess the roadmap for one uniquely eligible feature matching: {{ inputs.feature_request }}. Read dependencies and governing context. Return a structured result with the exact selected_entry_id as displayed in the roadmap and the exact proposed_status_patch. Do not mutate the roadmap. Stop if eligibility or entry identity is ambiguous, dependencies are unsatisfied, or governing context is incomplete. Never use the feature number alone as the entry identity."
  - id: approve-roadmap-patch
    type: gate
    message: "Review the exact roadmap patch and context coverage. Approve only a uniquely eligible, exact patch; otherwise amend the roadmap, resolve context, or defer."
    options: ["approve", "amend-roadmap", "resolve-context", "defer"]
    verdict_input: "roadmap_decision"
    on_reject: "skip"
  - id: route-roadmap-decision
    type: switch
    expression: "{{ steps.approve-roadmap-patch.output.choice }}"
    cases:
      approve:
        - id: apply-approved-roadmap-patch
          command: "speckit.flow-roadmap.write"
          integration: "{{ inputs.integration }}"
          input:
            args: "Apply only the exact roadmap patch the operator just approved for: {{ inputs.feature_request }}."
        - id: retrieve-governing-context
          command: "speckit.flow-wiki.query"
          integration: "{{ inputs.integration }}"
          input:
            args: "For {{ inputs.feature_request }}, retrieve cited governing decisions, constraints, dependencies, and coverage classification. Report Partial or Uncovered rather than inventing a fact."
        - id: draft-specification
          flow_kit:
            delegated: true
            agent: Architect
          command: "speckit.specify"
          integration: "{{ inputs.integration }}"
          input:
            args: "Create the specification for the approved roadmap feature: {{ inputs.feature_request }}. Preserve the approved outcome, scope, dependencies, and cited governing context."
        - id: assess-created-spec-linkage
          flow_kit:
            delegated: true
            agent: Verifier
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: "Inspect the created specification's actual directory and .specify/feature.json feature_directory, then compare them with every roadmap Spec dir mapping. Use the exact selected_entry_id returned by assess-eligibility and never infer identity from feature number alone. Return one structured result with state (linked, repairable, conflict, or ambiguous), selected_entry_id, actual_spec_dir, and evidence. Format actual_spec_dir as a repository-relative directory ending in slash. Use linked only when that one entry has exactly one exact mapping to this directory and no other entry claims the same directory. Use repairable only when the selected entry is uniquely identified and its Spec dir is missing or stale, no other entry claims the actual directory, and you can present a minimal exact patch to that row as proposed_patch. Write the patch as the exact Markdown row with the path inside backticks and no trailing punctuation inside the backticks. Return conflict when another entry claims the directory or mapping ownership conflicts. Return ambiguous when the selected roadmap entry or created spec directory cannot be identified uniquely. Do not edit the roadmap."
        - id: route-created-spec-linkage
          type: switch
          expression: "{{ steps.assess-created-spec-linkage.output.state }}"
          cases:
            linked:
              - id: brief-against-roadmap
                flow_kit:
                  delegated: true
                  agent: Verifier
                command: "speckit.flow-roadmap.brief"
                integration: "{{ inputs.integration }}"
                input:
                  args: "Run the roadmap brief with explicit constraints SPEC_TARGET={{ steps.assess-created-spec-linkage.output.actual_spec_dir }} and ROADMAP_ENTRY={{ steps.assess-created-spec-linkage.output.selected_entry_id }}. The brief must resolve the exact selected entry and spec directory."
              - id: review-specification-and-brief
                type: gate
                message: "Review the uniquely matched specification and roadmap brief. Choose the next human-directed state; this workflow does not start it automatically."
                options: ["clarify", "amend-roadmap", "resolve-context", "begin-planning", "defer"]
                verdict_input: "final_review_decision"
                on_reject: "skip"
            repairable:
              - id: review-spec-dir-patch
                type: gate
                message: "Review this exact Spec dir patch for roadmap entry {{ steps.assess-created-spec-linkage.output.selected_entry_id }} and directory {{ steps.assess-created-spec-linkage.output.actual_spec_dir }}:\n{{ steps.assess-created-spec-linkage.output.proposed_patch }}\nApprove only this patch verbatim; amendment or deferral makes no roadmap change."
                options: ["approve-exact-patch", "amend", "defer"]
                verdict_input: "linkage_patch_decision"
                on_reject: "skip"
              - id: route-spec-dir-patch-decision
                type: switch
                expression: "{{ steps.review-spec-dir-patch.output.choice }}"
                cases:
                  approve-exact-patch:
                    - id: apply-approved-spec-dir-patch
                      command: "speckit.flow-roadmap.write"
                      integration: "{{ inputs.integration }}"
                      input:
                        args: "Apply only this exact Spec dir patch, which was explicitly approved at review-spec-dir-patch, for roadmap entry {{ steps.assess-created-spec-linkage.output.selected_entry_id }} and actual directory {{ steps.assess-created-spec-linkage.output.actual_spec_dir }}: {{ steps.assess-created-spec-linkage.output.proposed_patch }}. Do not infer the target from its feature number or broaden the patch."
                    - id: verify-repaired-spec-linkage
                      flow_kit:
                        delegated: true
                        agent: Verifier
                      type: prompt
                      integration: "{{ inputs.integration }}"
                      prompt: "Re-read the roadmap after the approved write and re-check .specify/feature.json plus the actual created spec directory. Return a structured result with state and fresh evidence. Return state linked only if selected_entry_id {{ steps.assess-created-spec-linkage.output.selected_entry_id }} is the unique exact owner of actual_spec_dir {{ steps.assess-created-spec-linkage.output.actual_spec_dir }}. Otherwise return repairable, conflict, or ambiguous. Do not edit the roadmap."
                    - id: route-rechecked-spec-linkage
                      type: switch
                      expression: "{{ steps.verify-repaired-spec-linkage.output.state }}"
                      cases:
                        linked:
                          - id: brief-after-linkage-repair
                            flow_kit:
                              delegated: true
                              agent: Verifier
                            command: "speckit.flow-roadmap.brief"
                            integration: "{{ inputs.integration }}"
                            input:
                              args: "Refresh the roadmap brief with explicit constraints SPEC_TARGET={{ steps.assess-created-spec-linkage.output.actual_spec_dir }} and ROADMAP_ENTRY={{ steps.assess-created-spec-linkage.output.selected_entry_id }}; verify it resolves this exact pair."
                          - id: review-specification-and-refreshed-brief
                            type: gate
                            message: "Review the refreshed brief tied to the unique selected roadmap entry and exact specification directory. Choose the next human-directed state; this workflow does not start it automatically."
                            options: ["clarify", "amend-roadmap", "resolve-context", "begin-planning", "defer"]
                            verdict_input: "final_review_decision"
                            on_reject: "skip"
                        repairable:
                          - id: stop-after-linkage-recheck-repairable
                            type: prompt
                            integration: "{{ inputs.integration }}"
                            prompt: "Stop because the approved mapping patch did not produce one exact unique link. Preserve the refreshed roadmap/spec evidence and report the smallest safe next action; do not propose or apply another patch in this run."
                        conflict:
                          - id: stop-after-linkage-recheck-conflict
                            type: prompt
                            integration: "{{ inputs.integration }}"
                            prompt: "Stop because the refreshed roadmap shows conflicting Spec dir ownership after the approved patch. Preserve evidence and report the conflicting entries and required operator resolution."
                        ambiguous:
                          - id: stop-after-linkage-recheck-ambiguous
                            type: prompt
                            integration: "{{ inputs.integration }}"
                            prompt: "Stop because the refreshed roadmap/spec evidence still cannot identify a unique mapping. Preserve evidence and report the smallest safe operator action."
                      default:
                        - id: stop-after-linkage-recheck-invalid
                          type: prompt
                          integration: "{{ inputs.integration }}"
                          prompt: "Stop because the refreshed linkage assessment returned an invalid state. Preserve evidence and report the validation error."
                  amend:
                    - id: stop-for-linkage-amendment
                      type: prompt
                      integration: "{{ inputs.integration }}"
                      prompt: "Stop without changing the roadmap. The operator requested amendment of the proposed Spec dir patch; prepare a new exact patch for review before any write."
                  defer:
                    - id: stop-with-deferred-linkage
                      type: prompt
                      integration: "{{ inputs.integration }}"
                      prompt: "Stop without changing the roadmap. Record that the operator deferred roadmap linkage repair and preserve the exact proposed patch and evidence."
                default:
                  - id: stop-invalid-linkage-patch-decision
                    type: prompt
                    integration: "{{ inputs.integration }}"
                    prompt: "Stop without changing the roadmap because the exact linkage-patch decision was not recognized. Preserve the proposed patch and request a valid operator decision."
            conflict:
              - id: stop-on-linkage-conflict
                type: prompt
                integration: "{{ inputs.integration }}"
                prompt: "Stop because roadmap Spec dir ownership conflicts. Preserve the selected entry, conflicting mapping evidence, and created spec path; request operator resolution without proposing an automatic patch."
            ambiguous:
              - id: stop-on-ambiguous-linkage
                type: prompt
                integration: "{{ inputs.integration }}"
                prompt: "Stop because the selected roadmap entry or actual specification directory is ambiguous. Preserve candidate entries and paths; do not infer identity from feature number or mutate the roadmap."
          default:
            - id: stop-invalid-created-spec-linkage
              type: prompt
              integration: "{{ inputs.integration }}"
              prompt: "Stop because the post-specification linkage assessment returned an invalid state. Preserve evidence and report the validation error."
      amend-roadmap:
        - id: stop-for-roadmap-amendment
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: "Stop the start-feature workflow. Prepare a new exact approval-gated roadmap amendment; do not invent a replacement feature."
      resolve-context:
        - id: stop-for-context-resolution
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: "Stop the start-feature workflow. Report the missing or partial wiki coverage and the smallest evidence or human decision needed to continue."
      defer:
        - id: stop-with-deferred-feature
          type: prompt
          integration: "{{ inputs.integration }}"
          prompt: "Stop the start-feature workflow without changing roadmap, feature, branch, or specification state. Record that the operator deferred the candidate."
    default:
      - id: stop-invalid-roadmap-decision
        type: prompt
        integration: "{{ inputs.integration }}"
        prompt: "Stop. The roadmap decision was not recognized; retain the manual start-feature prompt as fallback."
