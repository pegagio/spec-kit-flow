schema_version: '1.0'
workflow:
  id: speckit-flow-converge
  name: Converge Feature
  version: "0.4.1"
  author: pegagio
  description: Assess convergence and repeat a shared correction waterfall, task analysis, and eligible implementation until clean or safely stopped.
requires:
  speckit_version: '>=1.0.10.dev0+pegagio.2'
  integrations:
    any:
      - codex
inputs:
  feature_context:
    type: string
    required: true
    prompt: Identify the implemented feature to converge
  integration:
    type: string
    default: codex
    enum:
      - codex
steps:
  - id: convergence-remediation-loop
    type: do-while
    condition: '{{ steps.assess-convergence.output.state == ''continue'' }}'
    max_iterations: 6
    steps:
      - id: append-task-remediation
        command: speckit.converge
        integration: '{{ inputs.integration }}'
        flow_kit:
          delegated: true
          agent: Architect
        input:
          args: >-
            Run speckit.converge for {{ inputs.feature_context }} against current implementation and the reviewed specification, plan, and tasks on every pass, including the first and the pass after implementation. Honor the command prerequisites and append-only task contract. Preserve all existing task IDs, completion markers, and completed work; do not modify specification, plan, or code. Return the full current findings, stable gap IDs, evidence, appended task IDs, and prerequisite errors in a report field. Leave tasks unchanged when clean. Do not invoke another workflow or take consequential decisions.
      - id: assess-convergence
        type: prompt
        flow_kit:
          delegated: true
          agent: Verifier
        prompt: >-
          Classify this fresh speckit.converge report for {{ inputs.feature_context }}: {{ steps.append-task-remediation.output.report }}. The command report is the authoritative finding source; do not substitute an independent convergence review. Return a validated outcome envelope with state complete, continue, needs-human, or blocked; stable reason_code; current repository-relative evidence paths with SHA-256 digests; remaining_ids; resolved_ids; and exactly one state-appropriate route. The first report establishes the gap baseline. Later reports must prove resolution of a prior gap against current implementation and required validation; new appended task IDs, completed checkboxes, changed bytes, and command success alone are not progress. Complete requires current convergence findings clean and required validation satisfied. Continue selects the highest affected in-scope entry as next_step_id: reconcile-convergence-specification, reconcile-convergence-plan, reconcile-convergence-tasks, or implement-remediation for implementation-only gaps. Product, constitutional, authority, material-scope, or ambiguous-recovery decisions require needs-human with a stable resume_action without taking the consequential action. Missing prerequisites, stale or unavailable reports, failed commands, and unsafe work require blocked with the smallest safe resume_action. Do not modify artifacts in this assessment. The controller validates this outcome and checks progress and the correction limit before entering any correction branch.
      - id: route-convergence-correction
        type: switch
        expression: '{{ steps.assess-convergence.output.state }}'
        cases:
          continue:
            - id: prepare-convergence-flowback
              type: prompt
              prompt: >-
                Prepare the correction waterfall for {{ inputs.feature_context }} from the current validated assess-convergence outcome. For next_step_id reconcile-convergence-specification, set spec_action, plan_action, and task_action to run. For reconcile-convergence-plan, skip specification and run plan and tasks. For reconcile-convergence-tasks, run only tasks. For implement-remediation, skip all three artifact stages. Return those action fields plus specification_args, plan_args, and task_args containing exact current findings and required downstream reconciliation. Missing evidence, unsupported routes, or required operator decisions stop before mutation. Preserve the selected existing feature, reviewed intent, task IDs, completion markers, and convergence work already recorded by speckit.converge. Do not create another feature. Routine flowback remains within the operator-issued scope; consequential changes require operator input. Do not invoke another FlowKit workflow.
            - id: route-specification-remediation
              type: switch
              expression: '{{ steps.prepare-convergence-flowback.output.spec_action }}'
              cases:
                run:
                  - id: reconcile-convergence-specification
                    command: speckit.specify
                    integration: '{{ inputs.integration }}'
                    flow_kit:
                      delegated: true
                      agent: Architect
                    input:
                      args: '{{ steps.prepare-convergence-flowback.output.specification_args }}'
                skip: []
            - id: route-plan-remediation
              type: switch
              expression: '{{ steps.prepare-convergence-flowback.output.plan_action }}'
              cases:
                run:
                  - id: reconcile-convergence-plan
                    command: speckit.plan
                    integration: '{{ inputs.integration }}'
                    flow_kit:
                      delegated: true
                      agent: Architect
                    input:
                      args: '{{ steps.prepare-convergence-flowback.output.plan_args }}'
                skip: []
            - id: route-task-remediation
              type: switch
              expression: '{{ steps.prepare-convergence-flowback.output.task_action }}'
              cases:
                run:
                  - id: reconcile-convergence-tasks
                    command: speckit.tasks
                    integration: '{{ inputs.integration }}'
                    flow_kit:
                      delegated: true
                      agent: Architect
                    input:
                      args: >-
                        {{ steps.prepare-convergence-flowback.output.task_args }} Preserve all existing task IDs, completion markers, and appended convergence work; reconcile tasks without dropping or renumbering prior work.
                skip: []
            - id: analyze-remediation-tasks
              command: speckit.analyze
              integration: '{{ inputs.integration }}'
              flow_kit:
                delegated: true
                agent: Verifier
              input:
                args: >-
                  Run fresh read-only analysis of current specification, plan, and tasks for {{ inputs.feature_context }}. Return full findings, severities, locations, recommendations, and prerequisite errors in a report output field. Do not modify artifacts or implement work. Missing, failed, or stale analysis cannot authorize implementation.
            - id: assess-remediation-eligibility
              type: prompt
              flow_kit:
                delegated: true
                agent: Verifier
              prompt: >-
                Assess this fresh analyzer report for {{ inputs.feature_context }}: {{ steps.analyze-remediation-tasks.output.report }}. Return a validated outcome envelope with state, stable reason_code, current repository-relative evidence paths and SHA-256 digests, remaining_ids, resolved_ids, and exactly one state-appropriate route. Return continue with next_step_id implement-remediation only when analysis is clean, dependent artifacts are reconciled, and exact in-scope unfinished tasks are eligible; include their IDs as remaining_ids. Complete here means no eligible task work, not Feature Converged. Needs-human reports the exact consequential decision with a stable resume_action; blocked reports unresolved analysis findings, stale or missing output, failed prerequisites, or uncertain task eligibility with a stable resume_action. Never infer eligibility from successful commands or checkbox claims.
            - id: route-remediation-implementation
              type: switch
              expression: '{{ steps.assess-remediation-eligibility.output.state }}'
              cases:
                continue:
                  - id: implement-remediation
                    command: speckit.implement
                    integration: '{{ inputs.integration }}'
                    flow_kit:
                      delegated: true
                      agent: Builder
                    input:
                      args: >-
                        Implement only the exact analyzed, eligible tasks for {{ inputs.feature_context }} identified by {{ steps.assess-remediation-eligibility.output.remaining_ids }}. Complete all remaining eligible work within that set, preserving reviewed scope and completed work. Stop for a concrete blocker, unsafe discovery, or required operator input; do not re-specify, re-plan, re-task, invoke another workflow, integrate Git, or claim acceptance. Return completed task IDs, validation evidence, and any blocker or operator question in a report output field.
                complete: []
                needs-human: []
                blocked: []
          complete: []
          needs-human: []
          blocked: []
    assessment_before_correction: true
  - id: report-convergence-outcome
    type: prompt
    prompt: >-
      Report the latest verified outcome for {{ inputs.feature_context }}, resolved and remaining gap IDs, completed task IDs, changed artifact paths, and validation evidence. Use only current-pass outcomes. Propagate any unresolved needs-human or blocked task eligibility result or implementation report; never replace it with an earlier convergence continue or complete outcome. Clean fresh convergence ends at Feature Converged; Close Out remains separately invoked. Otherwise report the exact blocker or required operator decision and safe resumption action, preserving completed work. No progress or exhaustion of five correction passes is a bounded stop, not clean convergence. Stop here; do not update the roadmap, integrate Git, or claim feature acceptance.
