schema_version: '1.0'
workflow:
  id: speckit-flow-closeout
  name: Close Out Feature
  version: "0.6.3"
  author: pegagio
  description: Debrief and reconcile through one bounded waterfall, approve exact roadmap verification, maintain wiki context, and report commit readiness without committing.
requires:
  speckit_version: '>=1.0.10.dev0+pegagio.2'
  integrations:
    any:
      - codex
inputs:
  feature_context:
    type: string
    required: true
    prompt: Enter the exact repository-relative spec directory for the converged feature to close out (for example specs/014-flowkit-workflow-improvements)
  integration:
    type: string
    default: codex
    enum:
      - codex
  roadmap_transition_decision:
    type: string
    default: ''
steps:
  - id: assess-closeout-readiness
    type: prompt
    prompt: Assess current convergence, completion authority, existing specification lifecycle state, and current trusted roadmap verification evidence for {{ inputs.feature_context }}. Return a validated outcome envelope with state complete, continue, or blocked; stable reason_code; current repository-relative evidence paths with SHA-256 digests; remaining_ids; resolved_ids; and exactly one state-appropriate route. Complete is allowed only when current evidence proves the Complete specification and roadmap entry are already verified with no unresolved in-scope work; use reason_code already-verified. Continue when clear evidence permits an in-place Draft-to-Complete update or a fresh debrief of an existing Complete specification; set next_step_id to debrief-roadmap. Blocked includes non-clean convergence, missing or untrusted evidence, unsupported lifecycle state, unsafe recovery, or required product, constitutional, authority, or material-scope decisions; preserve the exact question or blocker and stable resume_action. Do not mutate files, infer completion from command success, or claim acceptance. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).
    flow_kit:
      delegated: true
      agent: Reviewer
  - id: route-initial-closeout
    type: switch
    expression: '{{ steps.assess-closeout-readiness.output.state }}'
    cases:
      continue:
        - id: prepare-closeout-status
          type: prompt
          prompt: Using the ready initial assessment for {{ inputs.feature_context }}, recheck the exact existing specification and convergence evidence. Return status_action run only for an existing Draft specification whose current convergence and completion authority are clear; otherwise skip for an already Complete specification. Unsupported lifecycle state, lost evidence, or an unsettled decision stops before any command with the exact operator question or recovery action. Do not create a specification or change scope.
        - id: route-closeout-status
          type: switch
          expression: '{{ steps.prepare-closeout-status.output.status_action }}'
          cases:
            run:
              - id: mark-converged-specification-complete
                command: speckit.specify
                integration: '{{ inputs.integration }}'
                input:
                  args: 'SPECIFY_FEATURE_DIRECTORY={{ inputs.feature_context }} Update only the exact existing specification in place from Status: Draft to Status: Complete, as authorized by this Closeout workflow only when current convergence and completion authority are clear. Preserve every requirement, reviewed decision, and active feature identity. Do not create or renumber a feature, regenerate the specification, change scope, modify the roadmap, or imply verification or acceptance. Return the exact changed path, resulting status, and any blocker. Missing or unsupported state stops without creating files.'
                flow_kit:
                  delegated: true
                  agent: Specifier
            skip: []
        - id: closeout-debrief-loop
          type: do-while
          assessment_before_correction: true
          condition: '{{ steps.assess-closeout-debrief.output.state == ''continue'' }}'
          max_iterations: 6
          steps:
            - id: debrief-roadmap
              command: speckit.flow-roadmap.debrief
              integration: '{{ inputs.integration }}'
              input:
                args: SPEC_TARGET={{ inputs.feature_context }} Run a fresh read-only roadmap debrief against the exact existing specification and current attributable implementation delta on every pass, including the first and the pass after correction or implementation. Return the full findings and prerequisite errors in report, exact selected_entry_id, and any exact proposed verification patch in proposed_patch. Do not edit the roadmap. Missing, stale, failed, or untrusted delta must be reported, never treated as verified. Do not infer feature acceptance.
              flow_kit:
                delegated: true
                agent: Reviewer
            - id: assess-closeout-debrief
              type: prompt
              prompt: 'Classify this fresh debrief report for {{ inputs.feature_context }}: {{ steps.debrief-roadmap.output.report }}. Independently review implementation changes since the prior pass for code defects and relevant validation evidence. Include exact code findings and repository-relative evidence. Review an attributable implementation delta with changed paths and before/after evidence; if that boundary is unavailable, stop with an untrusted-delta recovery. Return exact review findings as a separate workflow-specific result alongside the strict envelope, retaining stable ID, task_id, artifact_location, violated requirement, observed deficiency, and exact correction. Fresh independent assessment must confirm substantive resolution and retain new blocking findings. With no safe eligible correction route, return blocked with a specific task-recording or reopening resumption action. Preserve the exact unanswered product question and never infer an answer; successful commands cannot discharge findings. A code finding may continue only when it is represented by an existing or newly recorded in-scope task that can be made eligible through the existing analysis and eligibility steps; otherwise return blocked with a precise resume_action to record or reopen the task before implementation. Return a validated outcome envelope with state complete, continue, or blocked; stable reason_code; current repository-relative evidence paths and SHA-256 digests; remaining_ids; resolved_ids; and exactly one state-appropriate route. Complete requires clean current convergence, an existing Complete specification, no material code-review finding, and a trusted debrief supporting either the exact proposed verification patch (reason_code patch-ready) or the already-verified roadmap entry (reason_code already-verified). Continue is limited to routine, safely repairable in-scope findings; select the highest affected next_step_id: reconcile-closeout-specification, reconcile-closeout-plan, reconcile-closeout-tasks, or implement-closeout-eligible-tasks. The first report establishes the finding baseline. Later reports must prove resolution of a prior finding; changed bytes, new tasks, checkboxes, status changes, and successful commands alone do not demonstrate progress. Blocked includes required product, constitutional, authority, material-scope, or ambiguous-recovery decisions, missing prerequisites, failed commands, stale evidence, untrusted delta, or unsafe correction. Preserve the exact question or blocker and stable resume_action without taking the consequential action. The controller validates this assessment and checks progress and the correction cap before entering the waterfall. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).'
              flow_kit:
                delegated: true
                agent: Code Reviewer
            - id: route-closeout-correction
              type: switch
              expression: '{{ steps.assess-closeout-debrief.output.state }}'
              cases:
                continue:
                  - id: prepare-closeout-flowback
                    type: prompt
                    prompt: Prepare the shared correction waterfall for {{ inputs.feature_context }} from the current validated assess-closeout-debrief outcome and fresh debrief report. For next_step_id reconcile-closeout-specification, set spec_action, plan_action, and task_action to run. For reconcile-closeout-plan, skip specification and run plan and tasks. For reconcile-closeout-tasks, run only tasks. For implement-closeout-eligible-tasks, skip all three artifact stages. Return implementation_args as readable text without template delimiters, preserving exact review findings verbatim and their eligible task mapping, plus those action fields and specification_args, plan_args, and task_args containing exact findings and required downstream reconciliation. Include explicit SPECIFY_FEATURE_DIRECTORY equal to the existing selected target in specification_args; do not create or renumber a feature. Preserve reviewed intent, lifecycle state, task IDs, completion markers, and completed work. Missing evidence, unsupported routes, or a product, constitutional, authority, material-scope, or ambiguous-recovery decision stops before mutation with the exact operator question and stable recovery action. Do not invoke another workflow.
                  - id: route-closeout-specification-remediation
                    type: switch
                    expression: '{{ steps.prepare-closeout-flowback.output.spec_action }}'
                    cases:
                      run:
                        - id: reconcile-closeout-specification
                          command: speckit.specify
                          integration: '{{ inputs.integration }}'
                          input:
                            args: '{{ steps.prepare-closeout-flowback.output.specification_args }}'
                          flow_kit:
                            delegated: true
                            agent: Specifier
                      skip: []
                  - id: route-closeout-plan-remediation
                    type: switch
                    expression: '{{ steps.prepare-closeout-flowback.output.plan_action }}'
                    cases:
                      run:
                        - id: reconcile-closeout-plan
                          command: speckit.plan
                          integration: '{{ inputs.integration }}'
                          input:
                            args: '{{ steps.prepare-closeout-flowback.output.plan_args }}'
                          flow_kit:
                            delegated: true
                            agent: Planner
                      skip: []
                  - id: route-closeout-tasks-remediation
                    type: switch
                    expression: '{{ steps.prepare-closeout-flowback.output.task_action }}'
                    cases:
                      run:
                        - id: reconcile-closeout-tasks
                          command: speckit.tasks
                          integration: '{{ inputs.integration }}'
                          input:
                            args: '{{ steps.prepare-closeout-flowback.output.task_args }}'
                          flow_kit:
                            delegated: true
                            agent: Tasker
                      skip: []
                  - id: analyze-closeout-artifacts
                    command: speckit.analyze
                    integration: '{{ inputs.integration }}'
                    input:
                      args: Run fresh read-only analysis of the current specification, plan, and tasks for {{ inputs.feature_context }} after the shared waterfall, including implementation-only routes. Return full findings and prerequisite errors in report. Do not modify artifacts or implement work. Missing, failed, or stale analysis cannot authorize implementation.
                    flow_kit:
                      delegated: true
                      agent: Reviewer
                  - id: assess-closeout-task-eligibility
                    type: prompt
                    prompt: 'Assess this fresh analyzer report: {{ steps.analyze-closeout-artifacts.output.report }} against current tasks for {{ inputs.feature_context }}. Return a validated outcome envelope with state complete, continue, or blocked, stable reason_code, current repository-relative evidence paths and SHA-256 digests, remaining_ids, resolved_ids, and exactly one state-appropriate route. Continue only when analysis is clean, dependent artifacts agree, and specific in-scope unfinished tasks are eligible; set next_step_id to implement-closeout-eligible-tasks and remaining_ids to their exact IDs. Complete means no eligible implementation work, not feature closeout. Blocked includes unresolved analysis, stale or missing output, failed prerequisites, uncertain eligibility, or required operator input; preserve the exact question or blocker and stable resume_action. A blocked result stops before implementation and any further debrief. Command success and checkbox claims alone are insufficient. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).'
                    flow_kit:
                      delegated: true
                      agent: Reviewer
                  - id: route-closeout-implementation
                    type: switch
                    expression: '{{ steps.assess-closeout-task-eligibility.output.state }}'
                    cases:
                      continue:
                        - id: implement-closeout-eligible-tasks
                          command: speckit.implement
                          integration: '{{ inputs.integration }}'
                          input:
                            args: Use these exact review findings {{ steps.prepare-closeout-flowback.output.implementation_args }}. Implement only the exact fresh analyzed eligible tasks for {{ inputs.feature_context }} listed in {{ steps.assess-closeout-task-eligibility.output.remaining_ids }} to resolve the current routine in-scope debrief findings. Preserve reviewed scope, task history, and completed work. Complete all eligible work in that set or stop for a concrete blocker or required operator input. Return completed and remaining IDs, validation evidence, changed paths, and any blocker or question in report. Do not re-specify, re-plan, re-task, invoke another workflow, update the roadmap, integrate Git, or claim acceptance.
                          flow_kit:
                            delegated: true
                            agent: Coder
                      complete: []
                      blocked: []
                complete: []
                blocked: []
      complete: []
      blocked: []
  - id: prepare-roadmap-verification
    type: prompt
    prompt: Use only completed outputs and validated controller decisions from this invocation. Return state patch-ready, already-verified, or blocked; selected_entry_id; exact spec_target; proposed_patch when applicable; and evidence. If the initial assessment was complete/already-verified, use that current trusted evidence without requiring a loop output. Otherwise only the latest successfully completed debrief assessment can support patch-ready or already-verified. A validated complete/patch-ready result must have the exact patch and entry from the same fresh debrief. A blocked initial or intermediate assessment, failed command, unresolved implementation blocker or question, invalid state, stale evidence, no-progress stop, or cap exhaustion yields blocked, regardless of an earlier continue or complete result. Never access a skipped step as if it ran. Preserve completed artifacts and the exact question or safe resumption action; do not mutate the roadmap.
  - id: route-roadmap-verification
    type: switch
    expression: '{{ steps.prepare-roadmap-verification.output.state }}'
    cases:
      patch-ready:
        - id: approve-roadmap-transition
          type: gate
          message: 'Review the fresh trusted debrief for {{ inputs.feature_context }}, exact entry {{ steps.prepare-roadmap-verification.output.selected_entry_id }}, and this exact proposed roadmap verification patch:

            {{ steps.prepare-roadmap-verification.output.proposed_patch }}

            Approve only this patch verbatim. Returning or deferring stops without a write.'
          options:
            - approve-patch
            - return-to-workflow
            - defer
          verdict_input: roadmap_transition_decision
          on_reject: skip
        - id: route-roadmap-transition
          type: switch
          expression: '{{ steps.approve-roadmap-transition.output.choice }}'
          cases:
            approve-patch:
              - id: apply-approved-roadmap-verification
                command: speckit.flow-roadmap.write
                integration: '{{ inputs.integration }}'
                input:
                  args: 'SPEC_TARGET={{ inputs.feature_context }} ROADMAP_ENTRY={{ steps.prepare-roadmap-verification.output.selected_entry_id }} Apply only this exact explicitly approved verification patch: {{ steps.prepare-roadmap-verification.output.proposed_patch }}. Do not broaden the patch or infer acceptance.'
          transition_labels:
            approve-patch: approved
            default: not-approved
          default: []
      already-verified: []
      blocked: []
  - id: prepare-wiki-maintenance
    type: prompt
    prompt: Re-read the exact selected roadmap entry and existing specification for {{ inputs.feature_context }}. Return state ready or blocked, selected_entry_id, and curated_sources. Ready requires either current trusted already-verified evidence or the exact approved patch successfully applied and freshly verified as the unique roadmap mapping with the requested verification state. Command success alone is insufficient. A prior blocked outcome, missing or failed write, divergent mapping, stale evidence, amendment, return, or deferral cannot reach wiki maintenance. Keep the original approval choice and reason for reporting. For both verified paths, select feature-relevant durable roadmap, constitution, ADR, workflow, architecture, guide, and feature artifacts within the operator-issued closeout scope; exclude ordinary implementation code unless an agent-facing contract. If source selection requires an unsettled consequential decision, return blocked with the exact question; do not invent operator selections. Existing verification does not skip wiki upkeep. Do not write files in this check.
    flow_kit:
      delegated: true
      agent: Roadmap Agent
  - id: route-wiki-maintenance
    type: switch
    expression: '{{ steps.prepare-wiki-maintenance.output.state }}'
    cases:
      ready:
        - id: wiki-reconciliation-loop
          type: do-while
          condition: '{{ steps.assess-wiki-maintenance.output.state == ''continue'' }}'
          max_iterations: 5
          steps:
            - id: prepare-wiki-refresh
              type: prompt
              prompt: Prepare one wiki source refresh within the exact curated source set {{ steps.prepare-wiki-maintenance.output.curated_sources }}. On the first pass, inspect source registry, related pages, current source bytes, and required closeout knowledge to record stable gap IDs for missing required source coverage or concrete stale claims. Include specific existing lint findings only with current verifiable evidence. On later passes, use the latest assess-wiki-maintenance remaining_ids and evidence. Map affected pages through their cited S-ids to normalized source identities; a stale page is not itself an ingestion source. Select exactly one readable, already-authorized project file or directory whose refresh can resolve the most specific gaps; source must be the single source token accepted by speckit.flow-wiki.ingest, not a list or prose instruction. Return source and baseline_remaining_ids. Track pending required source coverage until source registry and cited page content or a justified no-durable-change result substantiate it; command success alone does not clear a gap. Respect ingestion's page cap, citation policy, conflict preservation, and immutable sources. Required new source authority, unresolved conflicting claims, unavailable sources, uncertain mapping, or findings unsupported by source evidence stop with the exact question or blocker. A date-based stale warning alone does not authorize re-ingestion just to bump timestamps. Do not select the wiki page itself, expand the source set, fetch an undeclared URL, overwrite competing cited claims, or change source files. If all required sources are already represented, select one authorized closeout source for a bounded verification refresh; report justified no-change and let lint determine completion. Do not invoke another workflow.
            - id: ingest-curated-context
              command: speckit.flow-wiki.ingest
              integration: '{{ inputs.integration }}'
              input:
                args: '{{ steps.prepare-wiki-refresh.output.source }}'
              flow_kit:
                delegated: true
                agent: Wiki Curator
            - id: lint-wiki
              command: speckit.flow-wiki.lint
              integration: '{{ inputs.integration }}'
              input:
                args: Run the full wiki lint pass after the single-source refresh. Return the full findings and applied-fix evidence in report; missing or failed output is never clean.
              flow_kit:
                delegated: true
                agent: Reviewer
            - id: assess-wiki-maintenance
              type: prompt
              flow_kit:
                delegated: true
                agent: Reviewer
              prompt: Assess current source coverage, this ingestion report {{ steps.ingest-curated-context.output.report }}, this fresh lint report {{ steps.lint-wiki.output.report }}, and the prepared baseline gaps {{ steps.prepare-wiki-refresh.output.baseline_remaining_ids }}. Return a validated outcome envelope with state complete, continue, or blocked; stable reason_code; current repository-relative evidence paths and SHA-256 digests; remaining_ids identifying exact page/check/source coverage gaps; resolved_ids identifying prior gaps substantively resolved; and exactly one state-appropriate route. Complete requires every required curated source represented or explicitly justified as having no durable new knowledge, successful ingestion and lint, and no unresolved lint findings. Continue only for specific remaining gaps that re-ingesting one source within the already-authorized curated set can safely resolve; set next_step_id to prepare-wiki-refresh. For the first pass, prove resolution of at least one prepared gap before another pass; later passes must resolve a prior remaining ID. Re-inspect affected page claims, citations, source registry, and current source evidence; new timestamps, changed bytes, and command success alone are not progress. Blocked includes conflicting sources requiring an authority decision, age-only warnings without substantive refresh evidence, unknown or unavailable sources, scope expansion, malformed metadata, unsupported structural or semantic repairs, failed ingestion or lint, stale evidence, or unsafe retry. Preserve the exact question or blocker and stable resume_action. Never silently choose an authoritative claim or resolve a conflict marker. A no-progress or five-pass-cap stop remains incomplete and cannot authorize commit readiness. Both `reason_code` and `resume_action` must match `^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$` (lowercase letters and digits joined by single hyphens; never use underscores or spaces).
        - id: verify-closeout-readiness
          type: prompt
          prompt: Use only completed outputs and validated controller decisions. Inspect the latest assess-wiki-maintenance result, source coverage evidence, ingestion/lint results, and Git changes for {{ inputs.feature_context }}. Return state ready-for-explicit-commit or blocked and report. Ready-for-explicit-commit requires a validated complete wiki assessment, every required curated source represented or justified no-change, successful current ingestion and lint with no unresolved findings, and exact changes and validation evidence available for the final report. Missing, stale, failed, blocked, no-progress, or cap-limited wiki results cannot authorize readiness even when an earlier pass succeeded. Preserve partial approved roadmap and wiki changes and the smallest recovery action. Do not repair outside the declared loop, commit, integrate Git, or claim acceptance.
          flow_kit:
            delegated: true
            agent: Reviewer
      blocked: []
  - id: report-closeout-outcome
    type: prompt
    prompt: Report this invocation's exact outcome for {{ inputs.feature_context }} using only completed outputs and validated stop decisions. Include specification status, debrief and correction evidence, resolved and remaining findings, approved roadmap patch or existing verification, wiki ingestion and lint results, Git changes, and the original roadmap approval choice. Report ready for an explicit commit only when current verified maintenance passed and the latest verify-closeout-readiness result is ready-for-explicit-commit. Missing, failed, blocked, deferred, returned, stale, invalid, no-progress, or cap-limited outcomes remain stopped with the exact operator question or blocker and smallest safe resumption action. Preserve partial state, especially roadmap verification that succeeded before wiki failure; do not silently undo approved work. Readiness is an evidenced recommendation, not permission to commit; a subsequent explicit operator request is required. Stop here. Do not commit, push, integrate Git, invoke another workflow, or claim feature acceptance.
